<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steve Quesada Tattoo</title>
  
  <!-- Fuentes y FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --bg-dark: #0a0a0a;
      --gradient: linear-gradient(135deg, #bc1a1a 0%, #d4af37 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Cinzel', serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Fondo decorativo oriental */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(188, 26, 26, 0.15) 0%, rgba(10, 10, 10, 0.95) 70%);
      z-index: -1;
      pointer-events: none;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header y Navegación */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      margin-bottom: 40px;
    }

    .logo {
      font-family: 'Syncopate', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--gold);
      text-decoration: none;
    }

    .lang-switch button {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 5px 12px;
      cursor: pointer;
      font-family: 'Syncopate', sans-serif;
      font-size: 0.7rem;
      transition: all 0.3s ease;
    }

    .lang-switch button:hover {
      background: var(--gold);
      color: var(--bg-dark);
    }

    /* Títulos */
    h2 {
      font-family: 'Syncopate', sans-serif;
      text-align: center;
      letter-spacing: 6px;
      font-size: 1.8rem;
      color: var(--gold);
      margin-bottom: 30px;
    }

    /* Galería Rotativa */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 60px;
    }

    .work-item {
      position: relative;
      aspect-ratio: 1/1;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 4px;
      animation: fadeIn 0.8s ease forwards;
    }

    .work-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .work-item:hover img {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Ajustes visuales de FullCalendar */
    .fc {
      font-family: 'Cinzel', serif !important;
      background: rgba(15, 15, 15, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .fc .fc-toolbar-title {
      color: var(--gold) !important;
      font-family: 'Syncopate', sans-serif !important;
      font-size: 1.2rem !important;
      letter-spacing: 2px;
    }

    .fc .fc-button-primary {
      background-color: transparent !important;
      border-color: var(--gold) !important;
      color: var(--gold) !important;
      transition: all 0.3s ease;
    }

    .fc .fc-button-primary:hover {
      background-color: var(--gold) !important;
      color: var(--bg-dark) !important;
    }

    .fc-theme-standard td, .fc-theme-standard th {
      border-color: rgba(255, 255, 255, 0.1) !important;
    }

    .fc-col-header-cell-cushion {
      color: var(--gold) !important;
      font-family: 'Syncopate', sans-serif;
      font-size: 0.8rem;
    }

    .fc-daygrid-day-number {
      color: #ffffff !important;
      text-decoration: none !important;
    }

    /* Bloques de Eventos "Reservado" */
    .fc-daygrid-event {
      background: var(--gradient) !important;
      border: none !important;
      border-radius: 3px !important;
      padding: 2px 4px !important;
    }

    .fc-event-title {
      color: #ffffff !important;
      font-weight: 600 !important;
      font-size: 0.75rem !important;
    }

    /* Redes y WhatsApp */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 40px 0;
    }

    .social-link {
      color: var(--gold);
      text-decoration: none;
      font-family: 'Syncopate', sans-serif;
      letter-spacing: 2px;
      font-size: 0.9rem;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s ease;
    }

    .social-link:hover {
      border-color: var(--gold);
    }

    .whatsapp-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 55px;
      height: 55px;
      background-color: #25d366;
      color: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      z-index: 1000;
      text-decoration: none;
    }

    /* Soporte Multilenguaje */
    [lang="es"] .en-text, [lang="en"] .es-text {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <a href="#" class="logo">STEVE QUESADA</a>
      <div class="lang-switch">
        <button onclick="setLanguage('es')">ES</button>
        <button onclick="setLanguage('en')">EN</button>
      </div>
    </header>

    <!-- Sección de Galería -->
    <section>
      <h2>
        <span class="es-text">PORTAFOLIO</span>
        <span class="en-text">PORTFOLIO</span>
      </h2>
      <div id="galeria-tatuajes" class="gallery-grid"></div>
    </section>

    <!-- Sección del Calendario -->
    <section class="booking-section">
      <h2>
        <span class="es-text">DISPONIBILIDAD</span>
        <span class="en-text">AVAILABILITY</span>
      </h2>
      
      <div id="tattoo-calendar" style="width: 100%; max-width: 850px; margin: 0 auto;"></div>

      <!-- Leyenda visual -->
      <div class="calendar-legend" style="display: flex; gap: 25px; justify-content: center; align-items: center; margin-top: 25px; font-family: 'Syncopate', sans-serif; font-size: 0.75rem; letter-spacing: 1px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="width: 12px; height: 12px; background: var(--gradient); border-radius: 3px; display: inline-block; box-shadow: 0 0 8px rgba(188, 26, 26, 0.5);"></span>
          <span class="es-text" style="color: #ffffff;">Reservado / Ocupado</span>
          <span class="en-text" style="color: #ffffff;">Booked / Unavailable</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="width: 12px; height: 12px; background: rgba(20, 20, 20, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 3px; display: inline-block;"></span>
          <span class="es-text" style="color: var(--gold);">Disponible para agendar</span>
          <span class="en-text" style="color: var(--gold);">Available for booking</span>
        </div>
      </div>
    </section>

    <section style="text-align: center;">
      <div class="social-links">
        <a href="https://www.facebook.com/share/1GExeMFNzJ/" class="social-link" target="_blank">FACEBOOK</a>
        <a href="https://www.instagram.com/stevequesadatattoo" class="social-link" target="_blank">INSTAGRAM</a>
      </div>
    </section>
  </div>

  <a href="https://wa.me/message/W3BSUW7WJRABA1" class="whatsapp-btn" target="_blank" rel="noopener noreferrer">
    <i class="fab fa-whatsapp"></i>
  </a>

  <!-- Carga de Librerías de FullCalendar -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales-all.global.min.js"></script>

  <script>
    let tattooCalendar;

    function setLanguage(lang) {
      document.documentElement.lang = lang;
      localStorage.setItem('preferredLanguage', lang);
      if (tattooCalendar) {
        tattooCalendar.setOption('locale', lang);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('preferredLanguage') || 'es';
      const calendarEl = document.getElementById('tattoo-calendar');

      if (calendarEl) {
        tattooCalendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          locale: savedLang,
          height: 'auto',
          fixedWeekCount: false,
          googleCalendarApiKey: 'AIzaSyC1Njkjxw9ndNafp6fML2NZFabkhAJHLZU',
          events: 'citassteve@gmail.com',
          headerToolbar: {
            left: 'prev',
            center: 'title',
            right: 'next'
          },
          eventDataTransform: function(eventData) {
            const currentLang = localStorage.getItem('preferredLanguage') || 'es';
            eventData.title = currentLang === 'es' ? 'Reservado' : 'Booked';
            return eventData;
          },
          eventClick: function(info) {
            info.jsEvent.preventDefault();
          }
        });
        tattooCalendar.render();
      }

      setLanguage(savedLang);
    });

    // Galería Dinámica
    let todasLasImagenes = [];
    const cloudName = 'fw7wy1fk';
    const tag = 'galeria-steve';

    function mezclarArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function mostrarSeisImagenes() {
      const contenedor = document.getElementById('galeria-tatuajes');
      if (!contenedor || todasLasImagenes.length === 0) return;
      contenedor.innerHTML = '';
      const imagenesSeleccionadas = mezclarArray([...todasLasImagenes]).slice(0, 6);
      imagenesSeleccionadas.forEach((imagen, index) => {
        const divItem = document.createElement('div');
        divItem.className = 'work-item';
        divItem.style.animationDelay = `${0.15 * index}s`;
        const imgElement = document.createElement('img');
        imgElement.src = `https://res.cloudinary.com/${cloudName}/image/upload/v${imagen.version}/${imagen.public_id}.${imagen.format}`;
        imgElement.alt = "Steve Tattoo";
        imgElement.loading = "lazy";
        divItem.appendChild(imgElement);
        contenedor.appendChild(divItem);
      });
    }

    async function iniciarGaleria() {
      try {
        const url = `https://res.cloudinary.com/${cloudName}/image/list/${tag}.json`;
        const respuesta = await fetch(url);
        const data = await respuesta.json();
        todasLasImagenes = data.resources;
        mostrarSeisImagenes();
        setInterval(() => {
          mostrarSeisImagenes();
        }, 10000);
      } catch (error) {
        console.error('Error al cargar la galería rotativa:', error);
      }
    }

    iniciarGaleria();
  </script>
</body>
</html>
