<section class="booking-section">
      <h2 style="border:none; text-align:center; display:block;">
        <span class="es-text">DISPONIBILIDAD</span>
        <span class="en-text">AVAILABILITY</span>
      </h2>
      <p style="text-align:center; opacity:0.8; font-size: 0.8rem; letter-spacing: 4px; margin-bottom: 20px;"></p>
      
      <!-- Contenedor del Calendario -->
      <div id="tattoo-calendar" style="width: 100%; max-width: 850px; margin: 0 auto;"></div>

      <!-- Leyenda de Disponibilidad (Mantiene los colores de tu tema) -->
      <div class="calendar-legend" style="display: flex; gap: 25px; justify-content: center; align-items: center; margin-top: 25px; font-family: 'Syncopate', sans-serif; font-size: 0.75rem; letter-spacing: 1px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="width: 12px; height: 12px; background: var(--gradient); border-radius: 3px; display: inline-block; box-shadow: 0 0 8px rgba(188, 26, 26, 0.5);"></span>
          <span class="es-text" style="color: #ffffff;">Reservado / Ocupado</span>
          <span class="en-text" style="color: #ffffff;">Booked / Unavailable</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="width: 12px; height: 12px; background: rgba(20, 20, 20, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 3px; display: inline-block;"></span>
          <span class="es-text" style="color: var(--gold);">Disponible para agendar</span>
          <span class="en-text" style="color: var(--gold);">Available for booking</span>
        </div>
      </div>
    </section>

    <section style="text-align: center;">
      <div class="social-links">
        <a href="https://www.facebook.com/share/1GExeMFNzJ/" class="social-link" target="_blank">FACEBOOK</a>
        <a href="https://www.instagram.com/stevequesadatattoo" class="social-link" target="_blank">INSTAGRAM</a>
      </div>
    </section>
  </div>

  <a href="https://wa.me/message/W3BSUW7WJRABA1" class="whatsapp-btn" target="_blank" rel="noopener noreferrer">
    <i class="fab fa-whatsapp"></i>
  </a>

  <!-- Carga de Librerías de FullCalendar -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales-all.global.min.js"></script>

  <script>
    // VARIABLE GLOBAL DEL CALENDARIO
    let tattooCalendar;

    // Lógica de Menú Móvil
    const menuBtn = document.getElementById('mobile-menu-btn');
    const menuContainer = document.getElementById('mobile-menu-container');
    if (menuBtn && menuContainer) {
      const menuIcon = menuBtn.querySelector('i');
      menuBtn.addEventListener('click', () => {
        menuContainer.classList.toggle('active');
        if (menuContainer.classList.contains('active')) {
          menuIcon.classList.remove('fa-bars');
          menuIcon.classList.add('fa-times');
        } else {
          menuIcon.classList.remove('fa-times');
          menuIcon.classList.add('fa-bars');
        }
      });
    }

    // Lógica de Idiomas con LocalStorage
    function setLanguage(lang) {
      document.documentElement.lang = lang;
      localStorage.setItem('preferredLanguage', lang);
      if (tattooCalendar) {
        tattooCalendar.setOption('locale', lang);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('preferredLanguage') || 'es';
      const calendarEl = document.getElementById('tattoo-calendar');

      // INICIALIZAR EL CALENDARIO
      if (calendarEl) {
        tattooCalendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          locale: savedLang,
          height: 'auto',
          fixedWeekCount: false,
          googleCalendarApiKey: 'AIzaSyC1Njkjxw9ndNafp6fML2NZFabkhAJHLZU',
          events: 'citassteve@gmail.com',
          headerToolbar: {
            left: 'prev',
            center: 'title',
            right: 'next'
          },
          // MODIFICACIÓN CLAVE: Oculta los títulos privados de Google Calendar
          eventDataTransform: function(eventData) {
            const currentLang = localStorage.getItem('preferredLanguage') || 'es';
            eventData.title = currentLang === 'es' ? 'Reservado' : 'Booked';
            return eventData;
          },
          eventClick: function(info) {
            info.jsEvent.preventDefault();
          }
        });
        tattooCalendar.render();
      }

      // Aplicar los cambios al resto de la página web
      setLanguage(savedLang);
    });

    // ==========================================
    // Cargar Galería Dinámica y Rotativa
    // ==========================================
    let todasLasImagenes = [];
    const cloudName = 'fw7wy1fk';
    const tag = 'galeria-steve';

    function mezclarArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function mostrarSeisImagenes() {
      const contenedor = document.getElementById('galeria-tatuajes');
      if (!contenedor || todasLasImagenes.length === 0) return;
      contenedor.innerHTML = '';
      const imagenesSeleccionadas = mezclarArray([...todasLasImagenes]).slice(0, 6);
      imagenesSeleccionadas.forEach((imagen, index) => {
        const divItem = document.createElement('div');
        divItem.className = 'work-item';
        divItem.style.animationDelay = `${0.15 * index}s`;
        const imgElement = document.createElement('img');
        imgElement.src = `https://res.cloudinary.com/${cloudName}/image/upload/v${imagen.version}/${imagen.public_id}.${imagen.format}`;
        imgElement.alt = "Steve Tattoo";
        imgElement.loading = "lazy";
        divItem.appendChild(imgElement);
        contenedor.appendChild(divItem);
      });
    }

    async function iniciarGaleria() {
      try {
        const url = `https://res.cloudinary.com/${cloudName}/image/list/${tag}.json`;
        const respuesta = await fetch(url);
        const data = await respuesta.json();
        todasLasImagenes = data.resources;
        mostrarSeisImagenes();
        setInterval(() => {
          mostrarSeisImagenes();
        }, 10000);
      } catch (error) {
        console.error('Error al cargar la galería rotativa:', error);
      }
    }

    iniciarGaleria();
  </script>
</body>
</html>
